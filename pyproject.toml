[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "commahum"
version = "0.1.0"
description = "Stylistic rewriting of comments in Nix sources that never touches non-comment bytes"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "tree-sitter==0.25.2",
  "tree-sitter-nix==0.1.0",
]

[project.optional-dependencies]
# What the vendored humanizer-ru scanner needs (tools/style_report.py). The
# rewriting itself does not: src/commahum/bans.py reads the ban table with ast,
# so the package imports none of the skill's code.
style = [
  "razdel",
  "pymorphy3",
  "pymorphy3-dicts-ru",
]

[project.scripts]
commahum = "commahum.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/commahum"]

[tool.hatch.build.targets.sdist]
include = ["src/commahum", "tests", "eval", "README.md"]
