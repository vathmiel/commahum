[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "commahum"
version = "0.1.0"
description = "Stylistic rewriting of comments in Nix sources that never touches non-comment bytes"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
  "tree-sitter==0.25.2",
  "tree-sitter-nix==0.1.0",
]

[project.optional-dependencies]
# What the vendored humanizer-ru scanner needs (`commahum report` and
# `commahum measure`). A plain rewrite does not: src/commahum/bans.py reads the
# ban table with ast, so the package imports none of the skill's code.
style = [
  "razdel",
  "pymorphy3",
  "pymorphy3-dicts-ru",
]

[project.scripts]
commahum = "commahum.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/commahum"]

# An installed wheel has no `vendor/` above it — site-packages is as high as the
# walk up from `commahum/skill.py` goes — so the vendored trees travel inside the
# package, where that walk falls back to them. `vendor/` stays the layout of a
# checkout; `commahum/_vendor/` is how it reads once installed.
[tool.hatch.build.targets.wheel.force-include]
"vendor/humanizer-ru" = "commahum/_vendor/humanizer-ru"
"vendor/pi" = "commahum/_vendor/pi"

[tool.hatch.build.targets.sdist]
include = ["src/commahum", "tests", "eval", "vendor", "README.md", "LICENSE"]
